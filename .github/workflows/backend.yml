name: Backend CI/CD
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy the tested selected branch to production'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') { core.setOutput('code', 'true'); return; }
            let files;
            if (context.eventName === 'pull_request') {
              files = await github.paginate(github.rest.pulls.listFiles, {...context.repo, pull_number: context.issue.number, per_page: 100});
            } else {
              const before = context.payload.before;
              if (!before || /^0+$/.test(before)) { core.setOutput('code', 'true'); return; }
              files = (await github.rest.repos.compareCommitsWithBasehead({...context.repo, basehead: `${before}...${context.sha}`})).data.files || [];
              if (files.length >= 300) { core.setOutput('code', 'true'); return; }
            }
            const code = /^(package[.-]|src\/|gradle\/|gradlew|build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|Dockerfile|\.dockerignore|compose\.yaml|infra\/|scripts\/|\.github\/workflows\/)/;
            core.setOutput('code', String(files.some(f => code.test(f.filename) || code.test(f.previous_filename || ''))));
  verify:
    name: Backend checks
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Admin interface tests
        if: needs.changes.outputs.code == 'true'
        run: npm ci --ignore-scripts && npm test
      - name: Formatting, unit and PostgreSQL integration tests, application build
        if: needs.changes.outputs.code == 'true'
        run: ./gradlew --no-daemon check bootJar
      - name: Validate deployment configuration
        if: needs.changes.outputs.code == 'true'
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          cp .env.example infra/.env
          DATABASE_PASSWORD=ci-only BACKEND_IMAGE=local/gym:ci docker compose -f infra/compose.production.yaml config --quiet
          docker compose config --quiet
          docker build -t local/gym:ci .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: test-reports
          path: build/reports/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          name: backend-jar
          path: build/libs/app.jar
          retention-days: 7
  publish:
    needs: [changes, verify]
    if: >-
      needs.changes.outputs.code == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_production &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/calendar-ai' || github.ref == 'refs/heads/feat/web-browser-auth')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: backend-jar
          path: build/libs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/valerochka1337/valerochkagymbackend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Valerochka1337/ValerochkaGymBackend
  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    timeout-minutes: 10
    concurrency:
      group: backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install deployment files and deploy the tested digest
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          AI_SETTINGS_ENCRYPTION_KEY: ${{ secrets.AI_SETTINGS_ENCRYPTION_KEY }}
          MAIL_ENABLED: ${{ vars.MAIL_ENABLED }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
        run: |
          umask 077
          smtp_payload=$(mktemp)
          ai_key_payload=$(mktemp)
          cleanup() {
            if [[ -f ~/.ssh/gym-deploy ]]; then
              ssh -i ~/.ssh/gym-deploy -o BatchMode=yes -o ConnectTimeout=10 valerochka@62.84.122.55 'rm -f /opt/valerochkagym/incoming/smtp.json /opt/valerochkagym/incoming/ai.json /opt/valerochkagym/incoming/ai-encryption.json' || true
            fi
            rm -f "$smtp_payload" "$ai_key_payload" ~/.ssh/gym-deploy
          }
          trap cleanup EXIT
          python3 scripts/ai-encryption-config.py export > "$ai_key_payload"
          python3 scripts/smtp-config.py export > "$smtp_payload"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/gym-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp -i ~/.ssh/gym-deploy -o BatchMode=yes infra/compose.production.yaml scripts/deploy.sh scripts/backup.sh scripts/verify-restore.sh scripts/admin-role.sh scripts/admin-password.sh scripts/smtp-config.py scripts/ai-encryption-config.py valerochka@62.84.122.55:/opt/valerochkagym/incoming/
          scp -i ~/.ssh/gym-deploy -o BatchMode=yes "$smtp_payload" valerochka@62.84.122.55:/opt/valerochkagym/incoming/smtp.json
          scp -i ~/.ssh/gym-deploy -o BatchMode=yes "$ai_key_payload" valerochka@62.84.122.55:/opt/valerochkagym/incoming/ai-encryption.json
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/gym-deploy -o BatchMode=yes valerochka@62.84.122.55 "sudo /opt/valerochkagym/install-and-deploy.sh 'ghcr.io/valerochka1337/valerochkagymbackend@$IMAGE_DIGEST' '$REGISTRY_USER'"
