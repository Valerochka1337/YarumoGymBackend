name: gym-coach-playground
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: gym_playground
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: local-playground-only
    ports: ["127.0.0.1:15433:5432"]
    volumes: ["data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym_playground"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  data:
