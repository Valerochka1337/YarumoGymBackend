# Installed as /etc/nginx/sites-available/api.valerochkagym.tech.
# Existing Certbot certificate and renewal timer are retained.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.valerochkagym.tech;
    ssl_certificate /etc/letsencrypt/live/api.valerochkagym.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.valerochkagym.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10m;
    client_body_timeout 15s;
    # Capability URLs are excluded by the two exact token locations below. Other operational
    # routes remain logged normally, so this does not hide unrelated incidents.
    access_log /var/log/nginx/api.valerochkagym.tech.access.log;
    error_log /var/log/nginx/api.valerochkagym.tech.error.log;
    location = /health {
        proxy_pass http://127.0.0.1:18080/actuator/health/readiness;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location /actuator { return 404; }
    # BEGIN MANAGED ROUTINE SHARE ROUTES
    # Keep these exact public routes before any SPA fallback in the installed server block.
    location = /.well-known/assetlinks.json {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    # Valid capability URLs load the existing Yarumo Web shell without exposing the token to
    # backend HTML or caches. The browser then requests the allowlisted preview through /v1.
    location ~ "^/r/[A-Za-z0-9_-]{43}$" {
        access_log off;
        add_header X-Yarumo-Route browser-trial always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }
    location /r/ { return 404; }
    # Durable Coach endpoints must also win over the production SPA fallback.
    # A disconnected subscriber does not control the background worker.
    location ^~ /v1/coach/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
    location ~ "^/v1/routine-shares/preview/[A-Za-z0-9_-]{43}(/import|/trial-results)?$" {
        access_log off;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
    # END MANAGED ROUTINE SHARE ROUTES
    location = /v1/ai/coach-turn/stream {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name api.valerochkagym.tech;
    return 301 https://$host$request_uri;
}
